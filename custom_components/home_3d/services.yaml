ask:
  fields:
    text:
      required: true
      example: "Show the living room"
      selector:
        text:
    screen:
      required: false
      example: "Kitchen"
      selector:
        text:
    speak:
      required: false
      default: false
      selector:
        boolean:
set_style:
  fields:
    style:
      required: true
      example: "cozy"
      selector:
        select:
          custom_value: true
          options:
            - "neon"
            - "blueprint"
            - "day"
            - "realistic"
            - "focus"
            - "synthwave"
            - "cozy"
            - "evening"
            - "winter"
            - "model"
            - "pastel"
            - "warm"
            - "reset"
    screens:
      required: false
      example: "Kitchen"
      selector:
        text:
          multiple: true
    minutes:
      required: false
      example: 30
      selector:
        number:
          min: 1
          max: 10080
          unit_of_measurement: min
